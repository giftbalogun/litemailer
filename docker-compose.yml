version: "3.8"

services:
    litemail_app:
        build:
            context: .
            dockerfile: docker/Dockerfile
        image: litemailer
        container_name: litemailer_app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - ./docker/php.ini:/usr/local/etc/php/conf.d/custom.ini
        depends_on:
            - litemailer_db
        networks:
            - litemailer_network

    litemailer_nginx:
        image: nginx:alpine
        container_name: litemailer_nginx
        restart: unless-stopped
        ports:
            - "8081:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - litemail_app
        networks:
            - litemailer_network

    litemailer_db:
        image: mysql:8.0
        container_name: litemailer_db
        restart: unless-stopped
        environment:
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
        ports:
            - ${DB_PORT}:3306
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - litemailer_network
    
    litemailer_database_gui:
        image: phpmyadmin/phpmyadmin
        container_name: litemailer_database_gui
        restart: unless-stopped
        environment:
            PMA_HOST: litemailer_db
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
        ports:
            - '8085:80'
        depends_on:
            - litemailer_db
        networks:
            - litemailer_network

networks:
    litemailer_network:
        driver: bridge

volumes:
  dbdata:
